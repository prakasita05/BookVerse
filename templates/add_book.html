<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Book — BookVerse</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Dashboard Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    .form-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 48px;
      border-radius: 16px;
      box-shadow: var(--shadow-card);
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--forest-deep);
      margin-bottom: 8px;
    }
    
    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(61, 90, 64, 0.2);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--forest-muted);
      box-shadow: 0 0 0 3px rgba(61, 90, 64, 0.1);
    }
    
    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--forest-muted);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }
    
    .submit-btn:hover {
      background: var(--forest-deep);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    @media (max-width: 768px) {
      .form-container {
        padding: 32px 24px;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- Dashboard Header -->
<header class="dashboard-header">
  <div class="header-container">
    <a href="/home" class="header-logo">bookverse</a>
    
    <nav class="header-nav">
      <a href="/home" class="nav-link">Home</a>
      <a href="/library" class="nav-link">My Library</a>
      <a href="#" class="nav-link">Shelves</a>
      <a href="#" class="nav-link">Wishlist</a>
      <a href="#" class="nav-link">Discover</a>
      <a href="#" class="nav-link">Tracker</a>
    </nav>

    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Search books...">
    </div>

    <div class="header-user">
      <div class="user-avatar">R</div>
      <span style="font-size: 14px; font-weight: 500;">Reader</span>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="dashboard-main">
  <section class="mb-lg">
    <div style="max-width: 700px; margin: 0 auto;">
      <h1 style="font-family: var(--font-serif); font-size: 36px; color: var(--forest-deep); margin-bottom: 8px;">
        Add a New Book
      </h1>
      <p style="color: #666; margin-bottom: 32px;">
        Add a book to your personal library. You can search for it online or enter details manually.
      </p>
    </div>
  </section>

  <div class="form-container">
    <form id="add-book-form" onsubmit="handleSubmit(event)">
      <!-- Book Title -->
      <div class="form-group">
        <label class="form-label" for="title">Book Title *</label>
        <input type="text" 
               id="title" 
               name="title" 
               class="form-input" 
               placeholder="Enter the book title"
               required>
      </div>

      <!-- Author -->
      <div class="form-group">
        <label class="form-label" for="author">Author *</label>
        <input type="text" 
               id="author" 
               name="author" 
               class="form-input" 
               placeholder="Enter the author's name"
               required>
      </div>

      <!-- Genre and Pages -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="genre">Genre</label>
          <select id="genre" name="genre" class="form-select">
            <option value="">Select a genre</option>
            <option value="Fiction">Fiction</option>
            <option value="Non-Fiction">Non-Fiction</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Science Fiction">Science Fiction</option>
            <option value="Mystery">Mystery</option>
            <option value="Thriller">Thriller</option>
            <option value="Romance">Romance</option>
            <option value="Historical Fiction">Historical Fiction</option>
            <option value="Biography">Biography</option>
            <option value="Memoir">Memoir</option>
            <option value="Self-Help">Self-Help</option>
            <option value="Poetry">Poetry</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="pages">Pages</label>
          <input type="number" 
                 id="pages" 
                 name="pages" 
                 class="form-input" 
                 placeholder="Number of pages"
                 min="1">
        </div>
      </div>

      <!-- Cover URL -->
      <div class="form-group">
        <label class="form-label" for="cover">Cover Image URL</label>
        <input type="url" 
               id="cover" 
               name="cover" 
               class="form-input" 
               placeholder="https://example.com/book-cover.jpg">
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="form-label" for="status">Reading Status *</label>
        <select id="status" name="status" class="form-select" required>
          <option value="want-to-read">Want to Read</option>
          <option value="reading">Currently Reading</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" 
                  name="description" 
                  class="form-textarea" 
                  placeholder="Write a brief description or synopsis..."></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">
        📚 Add to My Library
      </button>
    </form>
  </div>
</main>

<script>
  function handleSubmit(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const bookData = Object.fromEntries(formData.entries());
    
    console.log('Book added:', bookData);
    
    // TODO: Send to backend
    alert('Book added successfully! (Backend integration coming soon)');
    
    // Redirect to library
    setTimeout(() => {
      window.location.href = '/library';
    }, 1000);
  }
</script>

</body>
</html>
