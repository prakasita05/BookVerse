<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookVerse Authentication — Enter your personal reading universe.">
  <title>BookVerse — Personal Reading Space</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Auth Page Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-root">

  <!-- Atmospheric Botanical Backdrop -->
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="vignette-overlay" aria-hidden="true"></div>

  <!-- Ambient Dust Particle Canvas -->
  <canvas id="dust-canvas" aria-hidden="true"></canvas>

  <!-- Navigation back link -->
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Return to Entrance</span>
  </a>

  <!-- Centered Glassmorphism Authentication Card -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- Header Branding -->
      <div class="auth-header">
        <h1 class="brand-title">bookverse</h1>
        <p class="brand-sub">welcome to your personal reading space</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="tab-btn active" id="tab-login" type="button" role="tab" aria-selected="true">Sign In</button>
        <button class="tab-btn" id="tab-signup" type="button" role="tab" aria-selected="false">Create Account</button>
      </div>

      <!-- Form -->
      <form action="/login" method="POST" class="auth-form" id="auth-form">

        <!-- Name Field (Visible on Sign Up) -->
        <div class="form-group signup-only" id="group-name" style="display: none;">
          <label for="input-name">Full Name</label>
          <input type="text" id="input-name" name="name" placeholder="Aurora Elms">
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="input-email">Email Address</label>
          <input type="email" id="input-email" name="email" required placeholder="reader@bookverse.com">
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="input-password">Password</label>
          <input type="password" id="input-password" name="password" required placeholder="••••••••">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn" id="submit-btn">
          Enter the Library
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or</span>
        </div>

        <!-- Continue with Google Button -->
        <button type="submit" class="google-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </form>

      <p class="auth-footer-note">
        Your reading space is private, cozy, and encrypted.
      </p>

    </div>
  </main>

</div>

<!-- Auth JS -->
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
