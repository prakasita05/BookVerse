<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookVerse — a universe between covers. Your cinematic literary reading entrance.">
  <title>BookVerse — Entrance</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Landing Page Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>

<body>

<!-- ============================================================
     ROOT CONTAINER — Cinematic Entrance Environment
     ============================================================ -->
<div class="landing-root" id="landing-root">

  <!-- Loading / Fallback Background (Dark Forest Espresso) -->
  <div class="video-poster-fallback" id="video-poster" aria-hidden="true"></div>

  <!-- User Created Hero Video Animation — New 4K Seamless Loop -->
  <video id="bg-video"
         class="bg-video"
         autoplay
         muted
         loop
         playsinline
         preload="auto"
         poster="{{ url_for('static', filename='images/bg_botanical.png') }}"
         aria-hidden="true">
    <source src="{{ url_for('static', filename='videos/rain_books_4k_seamless_loop.mp4') }}" type="video/mp4">
    Your browser does not support HTML5 background video.
  </video>

  <!-- Ultra-Subtle Vignette Overlay for Text Readability -->
  <div class="vignette-overlay" aria-hidden="true"></div>

  <!-- Ambient Dust / Light Particle Canvas -->
  <canvas id="dust-canvas" aria-hidden="true"></canvas>


  <!-- ==========================================================
       HERO CENTER TYPOGRAPHY & SINGLE CTA ACTION
       ========================================================== -->
  <main class="hero-center">
    <h1 class="brand-title">bookverse</h1>
    <p class="brand-sub">a universe between covers</p>
    <p class="brand-tagline">
      every book is a world.<br>
      step in and discover yours.
    </p>
    <a href="/login" class="enter-btn" id="enter-btn">Enter the Library</a>
  </main>

</div><!-- /.landing-root -->

<!-- Landing Page JavaScript Engine -->
<script src="{{ url_for('static', filename='js/landing.js') }}"></script>

</body>
</html>
