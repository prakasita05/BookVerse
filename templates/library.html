<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library — BookVerse</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Dashboard & Library Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/library.css') }}">
</head>

<body class="my-library-page">

<!-- Dashboard Header -->
<header class="dashboard-header">
  <div class="header-container">
    <a href="/home" class="header-logo">bookverse</a>
    
    <nav class="header-nav">
      <a href="/home" class="nav-link">Home</a>
      <a href="/library" class="nav-link active">My Library</a>
      <a href="/wishlist" class="nav-link">Wishlist</a>
      <a href="/reading-music" class="nav-link">Reading Music</a>
      <a href="/home#discover-section" class="nav-link">Discover</a>
      <a href="/tracker" class="nav-link">Tracker</a>
    </nav>

    <div class="header-search">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="text" 
             id="search-input"
             class="search-input" 
             placeholder="Search your library...">
    </div>

    <div class="header-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <span style="font-size: 14px; font-weight: 500;" id="user-name-display">Guest</span>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="dashboard-main">
  <section class="mb-2xl">
    <div class="section-header">
      <h1 class="section-title" style="font-size: 32px;">My Library</h1>
      <a href="/add-book" class="continue-reading-btn" style="display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>Add Book</span>
      </a>
    </div>
  </section>

  <!-- Filter Options -->
  <section class="mb-lg">
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button class="filter-tab-btn genre-chip active" data-filter="all" style="padding: 10px 20px; cursor: pointer; font-size: 14px;" onclick="filterLibrary('all')">
        All Books <span id="filter-count-all">(0)</span>
      </button>
      <button class="filter-tab-btn genre-chip" data-filter="reading" style="padding: 10px 20px; cursor: pointer; font-size: 14px;" onclick="filterLibrary('reading')">
        Currently Reading <span id="filter-count-reading">(0)</span>
      </button>
      <button class="filter-tab-btn genre-chip" data-filter="completed" style="padding: 10px 20px; cursor: pointer; font-size: 14px;" onclick="filterLibrary('completed')">
        Completed <span id="filter-count-completed">(0)</span>
      </button>
      <button class="filter-tab-btn genre-chip" data-filter="want-to-read" style="padding: 10px 20px; cursor: pointer; font-size: 14px;" onclick="filterLibrary('want-to-read')">
        Want to Read <span id="filter-count-wishlist">(0)</span>
      </button>
    </div>
  </section>

  <!-- Books Grid -->
  <section>
    <div class="books-grid" id="library-books-container">
      <div style="text-align: center; padding: 48px; color: #999; grid-column: 1 / -1;">
        <p>Loading your library...</p>
      </div>
    </div>
  </section>
</main>

<!-- Library JavaScript -->
<script src="{{ url_for('static', filename='js/library.js') }}"></script>

</body>
</html>
